name: C++ Complexity Detailed Heatmap Report (Windows Optimized)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  measure-cpp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lizard
        run: pip install lizard

      - name: Measure and Generate Heatmap HTML Report
        env:
          TARGET_DIRS: "sakura_core"
          EXCLUDE_PATTERN: "*test* *vendor* *third_party* *build*"
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          mkdir -p reports
          python .github/scripts/generate_complexity_report.py

      - name: Upload C++ Complexity HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: cpp-complexity-report
          path: reports/cpp_complexity_report.html
          retention-days: 30
